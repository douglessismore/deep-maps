<h1>V3 Dry Run — Before & After</h1>
<p class="sub">10 diverse moments rewritten under the v3 content framework. Left = current, right = proposed.</p>
<div id="pairs"></div>
<script>
var D=[{"id": "einstein-born-ulm-1879", "year": 1879, "old": {"name": "Albert Einstein Is Born in Ulm, Germany", "subtitle": "His parents feared he had a learning disability \u2014 he barely spoke until age three", "description": "Albert Einstein was born on 14 March 1879 in Ulm, in the Kingdom of W\u00fcrttemberg, to Hermann Einstein, a salesman and engineer, and Pauline Koch, both secular Ashkenazi Jews. His early development alarmed his parents \u2014 he was unusually slow to speak, leading them to worry about a learning disability. The family moved to Munich the following year. At age five, a compass his father gave him during an illness sparked a lifelong obsession with invisible forces; Einstein later said it convinced him that 'something deeply hidden had to be behind things.'"}, "new": {"name": "Einstein Is Born in Ulm", "subtitle": "Bahnhofstra\u00dfe 20, Ulm. The house was destroyed by Allied bombs in WWII. A memorial marks the site near the Gothic minster.", "description": "Albert Einstein was born here on 14 March 1879 to Hermann Einstein, a salesman, and Pauline Koch. He was so slow to speak his parents consulted doctors. The family moved to Munich the following year. At five, sick in bed, a compass from his father sparked a lifelong obsession with invisible forces. The house was destroyed by Allied bombs in World War II."}}, {"id": "jfk-dealey-plaza", "year": 1963, "old": {"name": "JFK Is Assassinated in Dallas", "subtitle": "Kennedy is shot in the presidential motorcade as it passes through Dealey Plaza", "description": "At 12:30 PM on November 22, 1963, shots rang out as the presidential motorcade passed through Dealey Plaza. Kennedy was struck in the head and back. Governor John Connally was also hit. The limousine raced to Parkland Hospital. Within hours, Dallas police arrested Lee Harvey Oswald."}, "new": {"name": "President Kennedy Is Assassinated in Dallas", "subtitle": "411 Elm St, Dealey Plaza, Dallas. The site is a National Historic Landmark. The Sixth Floor Museum occupies the former Texas School Book Depository.", "description": "At 12:30 PM on 22 November 1963, President John F. Kennedy was shot while riding in an open motorcade through Dealey Plaza. He was struck in the head and back. Governor John Connally, seated in front, was also hit. The limousine raced to Parkland Hospital, where Kennedy was pronounced dead at 1:00 PM. Dallas police arrested Lee Harvey Oswald at a nearby movie theater that afternoon."}}, {"id": "treaty-oak-lab", "year": 1989, "old": {"name": "Forensic Analysis Confirms Poisoning of Treaty Oak", "subtitle": "Scientists identify lethal concentrations of Velpar in the tree's system", "description": "Samples from the tree were rushed to laboratories where the chemical Velpar was identified. The concentration was so high it was described as an 'execution.' Cullen was eventually arrested after boasting about the poisoning at a local feed store."}, "new": {"name": "Treaty Oak Is Poisoned with Herbicide in Austin", "subtitle": "503 Baylor St, Austin. The tree survived and still stands in Treaty Oak Park, though reduced to about a third of its original canopy.", "description": "In 1989, someone poured the herbicide Velpar around the roots of Treaty Oak, a 500-year-old live oak considered sacred by the Comanche. The concentration was so high forensic analysts called it an execution. The city launched an unprecedented effort to save the tree, enlisting Ross Perot to fund treatment. Paul Cullen was arrested after boasting about it at a feed store. The tree survived but lost roughly two-thirds of its canopy."}}, {"id": "storming-bastille", "year": 1789, "old": {"name": "A Parisian Mob Storms the Bastille and Launches the French Revolution", "subtitle": "Nine hundred Parisians overrun a medieval fortress and tear it down stone by stone", "description": "On July 14, 1789, a Parisian mob of roughly 900 people attacked the Bastille, a medieval fortress used as a state prison. The crowd was after the gunpowder stored inside. After a four-hour siege and the defection of the garrison, the governor was killed and his head paraded through the streets."}, "new": {"name": "A Parisian Mob Storms the Bastille", "subtitle": "Place de la Bastille, Paris. The fortress was demolished; the July Column now stands on the site. The outline of the original walls is marked in the pavement.", "description": "On 14 July 1789, roughly 900 Parisians attacked the Bastille, a medieval fortress used as a state prison. They were after the gunpowder stored inside. After a four-hour siege and the defection of the garrison, the governor was killed and his head paraded through the streets on a pike. The fortress was torn down stone by stone over the following months. July 14 became France's national day."}}, {"id": "frida-bus-accident", "year": 1925, "old": {"name": "A Bus Crash Leaves Eighteen-Year-Old Frida Kahlo Bedridden for a Year", "subtitle": "The collision that broke Frida Kahlo's body and started one of the most extraordinary artistic careers in history", "description": "On September 17, 1925, eighteen-year-old Frida Kahlo was riding a wooden bus that collided with an electric streetcar at the intersection of Calzada de Tlalpan and Cuauht\u00e9motzin in Mexico City. A metal handrail impaled her through the pelvis."}, "new": {"name": "Frida Kahlo Is Impaled in a Bus Crash in Mexico City", "subtitle": "Calzada de Tlalpan and Cuauht\u00e9motzin intersection, Mexico City. The intersection is now a busy modern junction with no marker.", "description": "On 17 September 1925, eighteen-year-old Frida Kahlo was riding a wooden bus that collided with an electric streetcar at this intersection. A metal handrail impaled her through the pelvis, fracturing her spine, collarbone, ribs, and right leg. She spent a year in a full-body plaster cast. Her mother set up an easel over the bed. Kahlo began painting self-portraits, launching a career born entirely from convalescence."}}, {"id": "trinity-site", "year": 1945, "old": {"name": "Atomic Age Begins with the First Nuclear Detonation", "subtitle": "A blinding flash in the Jornada del Muerto desert changes the world", "description": "At 5:29:45 AM on July 16, 1945, the world's first nuclear device was detonated at the Trinity Site in the Jornada del Muerto desert. The blast was visible 200 miles away. Robert Oppenheimer famously quoted the Bhagavad Gita."}, "new": {"name": "The First Nuclear Weapon Is Detonated at Trinity Site", "subtitle": "Trinity Site, White Sands Missile Range, NM. Open to visitors two days per year (first Saturdays of April and October). The crater has been filled but a lava-rock obelisk marks ground zero.", "description": "At 5:29:45 AM on 16 July 1945, the Manhattan Project detonated a plutonium implosion device atop a 100-foot steel tower in the Jornada del Muerto desert. The explosion yielded 21 kilotons, vaporized the tower, and created a crater of radioactive glass later named trinitite. The flash was visible 200 miles away. Oppenheimer recalled thinking a line from the Bhagavad Gita. Three weeks later, a similar device was dropped on Nagasaki."}}, {"id": "annihilator-o-henry-letter", "year": 1885, "old": {"name": "William Sydney Porter Coins the Name 'Servant Girl Annihilators'", "subtitle": "An Austin bank clerk provides the moniker that defines the case", "description": "Living just blocks from the scenes of the Servant Girl Annihilator murders in 1885, Austin bank clerk William Sydney Porter\u2014later famous as O. Henry\u2014coined the term 'Annihilator.' In a letter to his friend, he wrote that the 'ichorous midnight assassin' continued to ply his trade."}, "new": {"name": "O. Henry Coins the Name 'Servant Girl Annihilators'", "subtitle": "Porter lived near the intersection of East 4th and Neches Streets in Austin. The neighborhood has been redeveloped.", "description": "In 1885, Austin bank clerk William Sydney Porter, later famous as the short-story writer O. Henry, lived just blocks from the murder scenes. In a letter to a friend, he coined the phrase that stuck: the Servant Girl Annihilators. He described the killer as an 'ichorous midnight assassin' who continued to ply his trade while the city panicked. The murders were never solved."}}, {"id": "great-fire-meireki", "year": 1657, "old": {"name": "The Great Fire of Meireki Destroys Half of Edo and Kills One Hundred Thousand", "subtitle": "A cursed kimono is burned at a temple and the fire consumes the world's largest city", "description": "On March 2, 1657, a fire broke out at Honmy\u014d-ji temple in Edo, according to legend when priests tried to burn a cursed kimono that had brought death to three successive owners. Fanned by winter winds, the fire burned for three days."}, "new": {"name": "The Great Fire of Meireki Destroys Half of Edo", "subtitle": "Honmy\u014d-ji temple, Bunkyo, Tokyo. The temple still stands, though rebuilt. Edo Castle's keep, destroyed in the fire, was never reconstructed.", "description": "On 2 March 1657, a fire broke out at Honmy\u014d-ji temple in Edo, according to legend when priests tried to burn a cursed kimono that had brought death to three successive owners. Fanned by winter winds, the fire burned for three days and destroyed over half the city, including Edo Castle's keep. An estimated 100,000 people died. The shogunate used the destruction to redesign the city with wider streets and firebreaks. The castle keep was never rebuilt."}}, {"id": "rp-arrest-site", "year": 1955, "old": {"name": "Rosa Parks Refuses to Give Up Her Bus Seat at the Empire Theatre Stop", "subtitle": "Where a refusal to move changed the direction of America", "description": "On December 1, 1955, at this street corner, Parks refused a bus driver's order to give up her seat to a white passenger. Her arrest triggered the 381-day Montgomery Bus Boycott, proving that non-violence could dismantle segregation."}, "new": {"name": "Rosa Parks Refuses to Give Up Her Bus Seat", "subtitle": "252 Montgomery St (corner of Lee St), Montgomery, AL. A city bus\u2013shaped memorial and historical marker stand at the site.", "description": "On 1 December 1955, Rosa Parks boarded a Cleveland Avenue bus here and sat in the first row of the colored section. When the white section filled, driver James Blake ordered her to give up her seat. She refused. Parks was arrested and fined $10 plus $4 in court costs. Her arrest triggered the 381-day Montgomery Bus Boycott, led by 26-year-old Martin Luther King Jr., and proved that nonviolent resistance could dismantle segregation."}}, {"id": "lanl-lab", "year": 1943, "old": {"name": "U.S. Army Builds the Secret City of Los Alamos", "subtitle": "A remote school becomes the hidden nerve center of the Manhattan Project", "description": "In 1943, the U.S. Army selected the remote Los Alamos Ranch School as the site for the Manhattan Project's weapons laboratory. Scientists including Robert Oppenheimer, Enrico Fermi, and Richard Feynman lived and worked behind barbed wire under assumed names."}, "new": {"name": "The U.S. Army Establishes Los Alamos Laboratory", "subtitle": "Los Alamos, NM. The town was classified until 1957. Los Alamos National Laboratory still operates on the mesa. The Bradbury Science Museum is open to the public.", "description": "In 1943, the U.S. Army took over the remote Los Alamos Ranch School on a mesa in the Jemez Mountains and built a secret weapons laboratory. The town received no mail delivery and appeared on no maps. Scientists including Oppenheimer, Fermi, and Feynman lived behind barbed wire under assumed names. At its peak the site employed over 6,000 people, all working toward a single goal: building an atomic bomb."}}];
var h='';

  h+='<div class="moment-pair">';

  h+='<div class="field-label">Description</div>';
  h+='<div class="md">'+m.old.description+'</div>';
  h+='<div class="cc">Name: '+m.old.name.length+' · Sub: '+m.old.subtitle.length+' · Desc: '+m.old.description.length+'</div>';
  h+='</div>';
  // New
  h+='<div class="side side-new">';
  h+='<span class="side-label label-new">V3 Framework</span>';
  h+='<div class="yr">'+m.year+'</div>';
  h+='<div class="mn">'+m.new.name+'</div>';
  h+='<div class="field-label">Subtitle (place annotation)</div>';
  h+='<div class="ms">'+m.new.subtitle+'</div>';
  h+='<div class="field-label">Description</div>';
  h+='<div class="md">'+m.new.description+'</div>';
  h+='<div class="cc">Name: '+m.new.name.length+' · Sub: '+m.new.subtitle.length+' · Desc: '+m.new.description.length+'</div>';
  h+='</div>';
  h+='</div>';
});
document.getElementById("pairs").innerHTML=h;
</script></body></html>
